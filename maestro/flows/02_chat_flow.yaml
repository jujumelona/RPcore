# maestro/flows/02_chat_flow.yaml
#
# 테스트: 스토리 선택 → 채팅화면 진입 → KV 로딩 완료 → 메시지 전송 → AI 응답 수신
#
# 검증 항목:
#   - KV 로딩 중 크래시 없음
#   - 메시지 전송 후 AI 응답이 렌더링됨
#   - 챕터 전환 후 상태 유지
#
# 실행:
#   maestro test maestro/flows/02_chat_flow.yaml

appId: com.rpplatform

---
- launchApp:
    clearState: false

- waitForAnimationToEnd:
    timeout: 15000

# ── 스토리 목록에서 첫 번째 항목 탭 ──────────────────────────────
# 앱에 testID="story-list-item-0" 가 없으면 아래를 활성화해 텍스트로 탭
# - tapOn:
#     text: ".*"    # 첫 번째 텍스트 요소 (정규식)
#     index: 0

- tapOn:
    id: "story-list-item-0"   # AIStoryChatScreen / StoryScreen 진입 버튼

# ── 모델 로딩 + KV 초기화 대기 (최대 30초) ─────────────────────────
# KV base 로딩 중에는 로딩 인디케이터가 표시됨
- waitForAnimationToEnd:
    timeout: 30000

# 채팅 입력창이 활성화될 때까지 대기
- waitFor:
    visible: true
    id: "chat-input"
    timeout: 30000

# ── 메시지 전송 ───────────────────────────────────────────────────
- tapOn:
    id: "chat-input"

- inputText: "안녕하세요"

- tapOn:
    id: "chat-send-button"

# ── AI 응답 대기 (최대 60초 — 온디바이스 LLM 추론 시간 고려) ─────────
- waitFor:
    visible: true
    id: "chat-message-ai-0"
    timeout: 60000

# AI 응답이 빈 문자열이 아닌지 확인
- assertVisible:
    id: "chat-message-ai-0"

# ── 스크롤 — 이전 메시지 접근 시 메모리 누수 여부 간접 확인 ──────────
- scroll

- waitForAnimationToEnd

# ── 두 번째 메시지 전송 — 연속 생성 크래시 없는지 검증 ───────────────
- tapOn:
    id: "chat-input"

- inputText: "계속 이야기해줘"

- tapOn:
    id: "chat-send-button"

- waitFor:
    visible: true
    id: "chat-message-ai-1"
    timeout: 60000
