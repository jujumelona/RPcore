# ── JVM ──────────────────────────────────────────────────────────
org.gradle.jvmargs=-Xmx8192m -Xms2048m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -XX:+UseG1GC -XX:SoftRefLRUPolicyMSPerMB=0
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# configuration-cache는 서드파티 라이브러리(reanimated, llama.rn, netinfo 등)와 호환되지 않아 비활성화
org.gradle.configuration-cache=false
org.gradle.vfs.watch=true

# ── Android ──────────────────────────────────────────────────────
android.useAndroidX=true
android.enableJetifier=false
android.defaults.buildfeatures.buildconfig=true
android.nonTransitiveRClass=true
android.suppressUnsupportedCompileSdk=36
org.gradle.daemon.performance.disable-logging=true
# ✅ [보안] R8 Full Mode: 더 공격적인 최적화 + 난독화 (ProGuard보다 강력)
android.enableR8.fullMode=true

# ── React Native ─────────────────────────────────────────────────
reactNativeArchitectures=arm64-v8a
newArchEnabled=true
# ✅ [보안] Hermes: JS 번들을 Bytecode로 사전 컴파일 → JS 소스 직접 노출 차단
hermesEnabled=true

# ── Kotlin ───────────────────────────────────────────────────────
kotlin.code.style=official
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
kotlin.daemon.jvm.options=-Xmx4096m -XX:+UseG1GC

# ── KSP ──────────────────────────────────────────────────────────
ksp.incremental=true
ksp.incremental.apt.mode=true
org.gradle.workers.max=2
